        <!-- logo qui se trouve dans le header  -->
        <div class="flex ">
            <img src="ballon.jpg" alt="football image logo" class="w-5 md:w-6 lg:w-5  mt-1 rounded-full">
            <h1 class="font-bold mt-1 ">TACHKILA</h1>

        </nav>
        <div class="flex items-center gap-2 text-xs bg-sky-950 px-3 py-1 rounded-full border border-sky-700">

                    <div>

                            class="rounded-xl border border-black w-full bg-sky-800 m-1 p-1"  class="error">
                            <p id="eror-contenu" class="text-amber-200 text-xs font-semibold mt-1" class="messageeror"></p>
                    </div>
                    <div class="flex justify-center gap-4 mt-1">
                        <button type="reset" class="bg-red-600 rounded-xl m-1 p-1 hover:bg-rose-800" id="annuler">Annuler</button>
                        <button type="submit" class="bg-green-600 rounded-xl m-1 p-1 hover:bg-emerald-600" id="Ajouter">Ajouter</button>
