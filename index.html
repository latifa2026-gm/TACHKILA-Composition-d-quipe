<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tachkila | Composition d'équipe - Atlas FC</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>

<body class="text-white flex flex-col md:flex-row min-h-screen bg-slate-900">
    <!-- message Notification (Toast) -->
    <div id="notification" class="fixed top-12 right-4 z-50 hidden px-4 py-2 rounded-lg text-sm font-bold shadow-lg transition-all duration-300"></div>

    <header class="bg-sky-800 fixed top-0 left-0 z-40 flex h-10 w-full items-center justify-between px-4">
        <div class="flex items-center gap-2">
            <img src="assets/ballon.jpg" alt="football image logo" class="w-5 rounded-full">
            <h1 class="font-bold">TACHKILA</h1>
        </div>
        <nav aria-label="legende des postes">
            <ul class="flex gap-4 md:gap-6 text-xs md:text-sm">
                <li class="list-disc marker:text-orange-600 text-orange-600">GB</li>
                <li class="list-disc marker:text-sky-400 text-sky-400">DEF</li>
                <li class="list-disc marker:text-green-500 text-green-500">MIL</li>
                <li class="list-disc marker:text-red-700 text-red-900">ATT</li>
            </ul>
        </nav>
        <div class="flex items-center gap-2 text-xs bg-sky-950 px-3 py-1 rounded-full border border-sky-700">
            <span class="text-sky-300">Schéma</span>
            <span class="font-bold text-amber-400">4-4-2</span>
        </div>
    </header>

    <!-- la partie Aside -->
    <aside class="flex w-full md:w-1/4 lg:w-1/5 min-h-screen bg-gray-400 pt-12 flex-col rounded-xl p-2 z-10">
        <button class="bg-green-600 rounded-full py-1 font-semibold hover:bg-green-700 text-sm" id="btn_ajouter">+ Ajouter un joueur</button>
        
        <div class="flex flex-col gap-1 my-2 px-1">
            <div class="flex justify-between items-center">
                <p class="font-bold text-gray-900 text-sm">Effectif</p>
                <button class="bg-orange-600 rounded-full px-2 py-0.5 text-xs font-bold" id="btn-nbr-joueur">0 joueur</button>
            </div>
            <p class="text-xs font-bold text-sky-950" id="compteur-places">Joueurs placés : 0 / 11</p>
        </div>

        <p class="text-xs text-gray-800 mb-2">Cliquer sur un joueur placé pour voir sa case sur le terrain, pour modifier ou supprimer.</p>

        <div id="liste" class="flex flex-col gap-2 overflow-y-auto max-h-[calc(100vh-220px)] pr-1">
            <div id="liste_joueurs" class="flex flex-col gap-2">
                <div class="bg-slate-900/80 text-slate-300 p-3 text-xs text-center rounded-xl border border-slate-700">
                    Aucun joueur dans l'effectif pour le moment.
                </div>
            </div>

            <template id="template-carte-joueur">
                <div class="carte-joueur flex items-center justify-between p-2 bg-slate-800 rounded-lg text-white mb-2 shadow border border-slate-700">
                    <div class="flex items-center gap-2">
                        <span class="font-bold card-poste px-1.5 py-0.5 rounded text-xs"></span>
                        <span class="font-bold card-nom text-xs"></span>
                        <span class="text-xs text-slate-400 card-numero"></span>
                    </div>

                    <div class="flex items-center gap-1">
                        <select class="select-position bg-slate-700 text-xs text-white p-1 rounded border border-slate-600 focus:outline-none">
                        </select>
                        <button type="button" class="btn-modifier hover:opacity-80 p-1">
                            <img src="assets/edit.png" alt="Modifier" class="w-4 h-4" />
                        </button>
                        <button type="button" class="btn-supprimer hover:opacity-80 p-1">
                            <img src="assets/supprimer.png" alt="Supprimer" class="w-4 h-4" />
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </aside>

    <!--la wone principale du terrain  -->
    <main class="flex-1 bg-green-600 pt-14 pb-6 flex justify-center items-center min-h-screen" id="contenu-principale">
        <div id="terrain">
            <div id="slot-gb" data-poste="GB" class="emplacement-joueur GB">GB</div>
            <div id="slot-dg" data-poste="DEF" class="emplacement-joueur box17">DG</div>
            <div id="slot-dc1" data-poste="DEF" class="emplacement-joueur box36">DC</div>
            <div id="slot-dc2" data-poste="DEF" class="emplacement-joueur box55">DC</div>
            <div id="slot-dd" data-poste="DEF" class="emplacement-joueur box77">DD</div>
            <div id="slot-mg" data-poste="MIL" class="emplacement-joueur box20">MG</div>
            <div id="slot-mc1" data-poste="MIL" class="emplacement-joueur box39">MC</div>
            <div id="slot-mc2" data-poste="MIL" class="emplacement-joueur box58">MC</div>
            <div id="slot-md" data-poste="MIL" class="emplacement-joueur box79">MD</div>
            <div id="slot-bu1" data-poste="ATT" class="emplacement-joueur box72">BU</div>
            <div id="slot-bu2" data-poste="ATT" class="emplacement-joueur box70">BU</div>
        </div>

        <!--icci le modale pour faire ajouter or modfier les joueurs -->
        <form action="" id="form" novalidate class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-[400px] bg-pink-500 rounded-xl p-3 hidden z-50">
            <div class="flex justify-between items-center mb-2">
                <p class="font-bold text-lg" id="form-title">Ajouter un joueur</p>
                <button id="btn-fermer" type="button" class="bg-red-600 rounded-xl px-2 py-0.5 font-bold hover:bg-red-700">X</button>
            </div>

            <div class="mb-2">
                <p><label for="Nom" class="text-sm">Nom complet</label></p>
                <input type="text" id="Nom" placeholder="Ex. Ayoub Mansouri" class="rounded-xl border border-black w-full bg-sky-800 m-1 p-1 text-white text-sm">
                <p id="eror-contenuN" class="text-amber-200 text-xs font-semibold mt-1 messageeror"></p>
            </div>

            <div class="mb-2">
                <p><label class="text-sm">Poste</label></p>
                <div class="the_post">
                    <div class="flex justify-between gap-1">
                        <label class="bg-gray-400 flex-1 rounded-xl m-1 p-1 text-black flex items-center justify-center gap-1 text-xs cursor-pointer">
                            <input type="radio" id="gd" name="post" value="GB">
                            <span>Gardien</span>
                        </label>
                        <label class="bg-gray-400 flex-1 rounded-xl m-1 p-1 text-black flex items-center justify-center gap-1 text-xs cursor-pointer">
                            <input type="radio" id="df" name="post" value="DEF">
                            <span>Défenseur</span>
                        </label>
                    </div>
                    <div class="flex justify-between gap-1">
                        <label class="bg-gray-400 flex-1 rounded-xl m-1 p-1 text-black flex items-center justify-center gap-1 text-xs cursor-pointer">
                            <input type="radio" id="ml" name="post" value="MIL">
                            <span>Milieu</span>
                        </label>
                        <label class="bg-gray-400 flex-1 rounded-xl m-1 p-1 text-black flex items-center justify-center gap-1 text-xs cursor-pointer">
                            <input type="radio" id="att" name="post" value="ATT">
                            <span>Attaquant</span>
                        </label>
                    </div>
                </div>
                <p class="post-error text-amber-200 text-xs font-semibold mt-1 messageeror"></p>
            </div>

            <div class="mb-2">
                <p><label for="Num" class="text-sm">Numéro (1 à 99)</label></p>
                <input type="number" id="Num" placeholder="Ex. 7" class="rounded-xl border border-black w-full bg-sky-800 m-1 p-1 text-white text-sm">
                <p id="eror-contenu" class="text-amber-200 text-xs font-semibold mt-1 messageeror"></p>
            </div>

            <div class="flex justify-center gap-4 mt-3">
                <button type="button" class="bg-red-600 rounded-xl px-4 py-1 hover:bg-rose-800 text-sm" id="annuler">Annuler</button>
                <button type="submit" class="bg-green-600 rounded-xl px-4 py-1 hover:bg-emerald-600 text-sm" id="Ajouter">Enregistrer</button>
            </div>
        </form>
    </main>
</body>

</html>
